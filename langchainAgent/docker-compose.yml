services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice-agent:latest
    container_name: voice_ai_agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    # Persist long-term user facts across container restarts:
    volumes:
      - ./memory:/app/memory
    stdin_open: true
    tty: true
